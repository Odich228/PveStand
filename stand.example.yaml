# Сначала: ./pvestand -c stand.yaml -run validate
name: lab
node: pve
pool: lab
full_clone: true
networks:
  - bridge: vmbr101
    comment: Изолированная сеть стенда
vms:
  - name: gateway
    template: 9000
    cores: 2
    sockets: 1
    memory: 2048
    cpu: x86-64-v2-AES
    # storage: local-lvm  # только при full_clone: true
    boot_order: [scsi0, net0]
    replace_nics: true
    nics:
      - bridge: vmbr0
      - bridge: vmbr101
        model: virtio
        # vlan: 100
    start: true
    # ready: agent        # нужен включённый и установленный qemu-guest-agent
    # ready_timeout: 120  # секунды; по умолчанию 120
  - name: server
    template: 9001
    count: 1
    memory: 2048
    depends_on: [gateway]
    replace_nics: true
    nics:
      - bridge: vmbr101
    start: true
    # ready: tcp          # проверяется с компьютера, где запущен pvestand
    # ready_address: 192.0.2.20:22
users:
  - id: student@pve
    password_env: LAB_STUDENT_PASSWORD
    role: PVEVMUser
    # Вместо password_env можно задать password_file: ./student.secret
    # password: ... тоже поддерживается; не коммитьте реальные пароли.
# Для нескольких участников каждый должен иметь собственных пользователей:
